<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>@MELIKOV_55 | Мобильный набор инструментов</title>
    <meta name="description" content="Через официальный Telegram-бот @MELIKOV_55 дастрасӣ ба воситаҳо ва пешгӯииҳо. Оптимизированный интерфейс для мобильных устройств.">
    <link rel="icon" href="favicon.ico" type="image/x-icon">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&family=Orbitron:wght@500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" integrity="sha512-DTOQO9RWCH3ppGqcWaEA1BIZOC6xxalwEsw9c2QQeAIftl+Vegovlnee1c9QX4TctnWMn13TZye+giMm8e2LwA==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.css"/>
    <link rel="stylesheet" href="style.css">
</head>
<body class="preload">
    <div id="loader" class="loader">
        <div class="loader-signal">
            <div class="signal-bar"></div>
            <div class="signal-bar"></div>
            <div class="signal-bar"></div>
            <div class="signal-bar"></div>
            <div class="signal-bar"></div>
        </div>
        <p class="loader-text">Таҳлили пайвастшавӣ... <br> Бот: @MELIKOV_55</p>
    </div>
    <div id="background-effects" class="background-effects">
        <div class="gradient-mesh"></div>
    </div>
    <nav id="main-nav" class="main-nav" aria-label="Main Navigation">
        <div class="nav-items-container">
            <div class="nav-item">
                <button class="nav-button" id="nav-profile-btn" aria-controls="profile-modal">
                    <i class="fas fa-user-shield nav-icon" aria-hidden="true"></i>
                    <span class="nav-text">Профил</span>
                </button>
            </div>
            <div class="nav-item">
                 <button class="nav-button" id="nav-settings-btn" aria-controls="settings-modal">
                    <i class="fas fa-sliders nav-icon" aria-hidden="true"></i>
                    <span class="nav-text">Танзимот</span>
                </button>
            </div>
        </div>
    </nav>
    <main id="main-content" class="main-content">
        <header class="page-header">
            <p class="page-header-subtitle">Бот расмии иҷозатшуда</p>
            <h1 class="telegram-handle">@MELIKOV_55</h1>
        </header>
        <section class="game-slider-section" aria-labelledby="game-slider-heading">
            <h2 id="game-slider-heading" class="section-heading">Воситаҳои дастрас</h2>
            <div class="swiper game-swiper">
                <div class="swiper-wrapper">
                    <div class="swiper-slide">
                        <div class="game-card" data-game-key="mines">
                             <div class="game-card-image-wrapper">
                                <img src="other/3.jpg" alt="Mines Predictor Background" class="game-image-bg" loading="lazy">
                                <div class="game-card-overlay"></div>
                             </div>
                             <div class="game-card-content">
                                 <h3 class="game-title">Майнс Пешгӯӣкунанда</h3>
                                 <a href="min/index.html" class="btn btn-primary game-launch-btn" title="Оғоз кардани Воситаи Майнс">
                                     <i class="fas fa-play" aria-hidden="true"></i> Оғоз
                                 </a>
                             </div>
                         </div>
                    </div>
                    <div class="swiper-slide">
                         <div class="game-card" data-game-key="coin">
                            <div class="game-card-image-wrapper">
                               <img src="other/1.png" alt="Coin Flip Oracle Background" class="game-image-bg" loading="lazy">
                               <div class="game-card-overlay"></div>
                            </div>
                            <div class="game-card-content">
                                <h3 class="game-title">Coin Flip Oracle</h3>
                                <a href="coi/index.html" class="btn btn-primary game-launch-btn" title="Оғоз кардани Coin Flip Oracle">
                                    <i class="fas fa-play" aria-hidden="true"></i> Оғоз
                                </a>
                            </div>
                         </div>
                    </div>
                </div>
                <div class="swiper-pagination"></div>
                <div class="swiper-button-prev swiper-nav-btn"><i class="fas fa-chevron-left"></i></div>
                <div class="swiper-button-next swiper-nav-btn"><i class="fas fa-chevron-right"></i></div>
            </div>
        </section>
    </main>
    <div class="modal-overlay" id="modal-overlay" aria-hidden="true"></div>
    <div class="modal" id="settings-modal" role="dialog" aria-modal="true" aria-labelledby="settings-title" aria-hidden="true" data-state="closed">
        <div class="modal-handle" aria-hidden="true"></div>
        <div class="modal-header">
            <h2 class="modal-title" id="settings-title">
                <i class="fas fa-cog modal-title-icon" aria-hidden="true"></i> Танзимоти Интерфейс
            </h2>
        </div>
        <div class="modal-body">
            <div class="setting-item">
                <label class="setting-label" for="setting-background-toggle">Эффектҳои Пасзамина</label>
                <div class="setting-control">
                    <p class="setting-description">Танзими эффекти аниматсионии пасзамина.</p>
                     <button class="btn btn-toggle" id="setting-background-toggle" role="switch" aria-checked="true" data-setting="backgroundEnabled">
                         <span class="toggle-knob"></span>
                         <span class="toggle-text-on">Тамом шудааст</span>
                         <span class="toggle-text-off">Иштибоҳ</span>
                     </button>
                </div>
            </div>
        </div>
        <div class="modal-footer">
             <button class="btn btn-secondary" id="settings-close-btn-footer">Иҷро кунед ва Бандишро банд кунед</button>
        </div>
    </div>
    <div class="modal" id="profile-modal" role="dialog" aria-modal="true" aria-labelledby="profile-title" aria-hidden="true" data-state="closed">
         <div class="modal-handle" aria-hidden="true"></div>
        <div class="modal-header">
            <h2 class="modal-title" id="profile-title">
                <i class="fas fa-id-card modal-title-icon" aria-hidden="true"></i> Профили Оператор
            </h2>
        </div>
        <div class="modal-body">
            <div id="nickname-section" class="profile-section">
                <label for="nickname-input" id="nickname-label" class="form-label">Номи Оператор</label>
                <div class="input-group">
                    <input type="text" id="nickname-input" class="form-input" placeholder="Мисол: Alpha-7...">
                    <button id="nickname-save-btn" class="btn btn-primary">
                        <i class="fas fa-save" aria-hidden="true"></i> <span>Савдо</span>
                    </button>
                </div>
            </div>
            <div id="profile-info" class="profile-section" style="display: none;">
                <h3 class="profile-section-title">Вазъи Ҳозира</h3>
                <div class="profile-field">
                    <strong class="profile-label"><i class="fas fa-tag profile-icon" aria-hidden="true"></i> Номи Оператор:</strong>
                    <span id="nickname-display" class="profile-value"></span>
                </div>
            </div>
        </div>
        <div class="modal-footer">
             <button class="btn btn-secondary" id="profile-close-btn-footer">Худо шукр</button>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-bundle.min.js"></script>
    <script src="script.js" defer></script>
</body>
</html>
